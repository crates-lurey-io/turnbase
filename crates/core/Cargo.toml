[package]
name = "turnbase"
description = "Headless, deterministic turn-based game engine core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"

[lints]
workspace = true

# Document every feature-gated item on docs.rs, not just the default build.
[package.metadata.docs.rs]
all-features = true

[features]
# Opt-in Serialize/Deserialize for the public types; default build stays dep-free.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
