[package]
name = "turnbase-simulator"
description = "Interactive retroglyph terminal client for the Turnbase engine, over a turnbase-match turn loop"
# Always ships the retroglyph UI: it is the crate's whole purpose. A build that
# wants only the headless turn loop depends on `turnbase-match` directly.
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
turnbase = { path = "../core" }
turnbase-match = { path = "../match" }
retroglyph-core = { version = "0.2" }
retroglyph-crossterm = { version = "0.1" }

[dev-dependencies]
examples = { path = "../../examples" }
turnbase-bots = { path = "../bots" }
