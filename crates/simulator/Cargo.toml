[package]
name = "turnbase-simulator"
description = "Interactive retroglyph terminal client for the Turnbase engine, over a turnbase-match turn loop"
# Always ships the retroglyph UI: it is the crate's whole purpose. A build that
# wants only the headless turn loop depends on `turnbase-match` directly.
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["crossterm"]
# The crossterm terminal runner (`run`). On by default; disable it (e.g. for a
# wasm build that drives `SimulationRunner` with a browser backend instead) to
# drop the retroglyph-crossterm dependency, which does not compile for wasm.
# `SimulationRunner` and `PrintableGame` are backend-generic and always built.
crossterm = ["dep:retroglyph-crossterm"]

[dependencies]
turnbase = { workspace = true }
turnbase-match = { workspace = true }
turnbase-bots = { workspace = true }
retroglyph-core = { workspace = true }
# Backend-generic widgets (the setup modal, seat list). wasm-safe, so the web
# demos get the same interactive session as the native client.
retroglyph-widgets = { workspace = true }
retroglyph-crossterm = { workspace = true, optional = true }
