[package]
name = "turnbase-bots"
description = "Search and policy bots for the Turnbase engine (random, minimax, MCTS)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"

[lints]
workspace = true

# Document every feature-gated item on docs.rs, not just the default build.
[package.metadata.docs.rs]
all-features = true

[dependencies]
turnbase = { workspace = true }

[dev-dependencies]
tic_tac_toe = { path = "../../examples/tic_tac_toe", default-features = false }
high_card = { path = "../../examples/high_card", default-features = false }
coup = { path = "../../examples/coup", default-features = false }
proptest = { workspace = true }
