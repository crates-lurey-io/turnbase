[package]
name = "turnbase-session"
description = "The Session port for Turnbase: in-memory and file-backed hosts behind one request/response interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
turnbase = { workspace = true, features = ["serde"] }
turnbase-protocol = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
