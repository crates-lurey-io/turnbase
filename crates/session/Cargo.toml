[package]
name = "turnbase-session"
description = "The Session port for Turnbase: in-memory and file-backed hosts behind one request/response interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
turnbase = { path = "../core", features = ["serde"] }
turnbase-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
