[package]
name = "turnbase-session"
description = "The Session port for Turnbase: in-memory and file-backed hosts behind one request/response interface"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"

[lints]
workspace = true

# Document every feature-gated item on docs.rs, not just the default build.
[package.metadata.docs.rs]
all-features = true

[dependencies]
turnbase = { workspace = true, features = ["serde"] }
turnbase-protocol = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
