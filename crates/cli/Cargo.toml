[package]
name = "turnbase-cli"
description = "Generic command-line runner for Turnbase games: headless play, self-play, and interactive play"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"

[lints]
workspace = true

# Document every feature-gated item on docs.rs, not just the default build.
[package.metadata.docs.rs]
all-features = true

[features]
# The interactive retroglyph dashboard (`run_tui`). On by default; a game that
# only wants headless + text play depends on this crate with
# `default-features = false` and never links a terminal UI.
default = ["tui"]
tui = ["dep:turnbase-simulator"]

[dependencies]
turnbase = { workspace = true }
turnbase-bots = { workspace = true }
turnbase-match = { workspace = true }
turnbase-protocol = { workspace = true }
turnbase-session = { workspace = true }
turnbase-simulator = { workspace = true, features = ["crossterm"], optional = true }
clap = { version = "4", features = ["derive"] }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
