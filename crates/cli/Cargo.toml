[package]
name = "turnbase-cli"
description = "Generic command-line runner for Turnbase games: headless play, self-play, and interactive play"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The interactive retroglyph dashboard (`run_tui`). On by default; a game that
# only wants headless + text play depends on this crate with
# `default-features = false` and never links a terminal UI.
default = ["tui"]
tui = ["dep:turnbase-simulator"]

[dependencies]
turnbase = { path = "../core" }
turnbase-bots = { path = "../bots" }
turnbase-match = { path = "../match" }
turnbase-protocol = { path = "../protocol" }
turnbase-session = { path = "../session" }
turnbase-simulator = { path = "../simulator", optional = true }
clap = { version = "4", features = ["derive"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
