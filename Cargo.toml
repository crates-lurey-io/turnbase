[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/bots",
    "crates/match",
    "crates/simulator",
    "crates/protocol",
    "crates/session",
    "crates/cli",
    "crates/demos",
    "examples/tic_tac_toe",
    "examples/high_card",
    "examples/coup",
    "examples/rock_paper_scissors",
    "examples/minion_battle",
    "examples/risk",
    "examples/blackjack",
    "examples/hanabi",
    "examples/woodland",
    "examples/spire_run",
]

[workspace.package]
# Inherited by the example game crates only. The seven publishable crates under crates/* each carry
# a literal `version` instead, because they are versioned independently: a change confined to one
# leaf crate bumps that crate alone. Release tooling rewrites those literals, and cannot rewrite a
# single shared value without bumping every crate in lockstep.
version = "0.1.0"
edition = "2024"
# The floor is set by retroglyph (crates/cli, crates/simulator, crates/demos), which declares 1.88;
# 1.87 is rejected outright by cargo. crates/core on its own compiles as far back as 1.87 -- one
# version lower -- which is not enough of a gap to justify per-crate MSRVs. Verified by building
# against each toolchain rather than inferred from the edition.
rust-version = "1.88"
authors = ["Matan Lurey <matan@lurey.org>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/crates-lurey-io/turnbase"
homepage = "https://turnbase.lurey.dev/"
documentation = "https://crates-lurey-io.github.io/turnbase/"
keywords = ["game-engine", "turn-based", "deterministic", "gamedev", "ai"]
categories = ["game-development", "simulation"]

# One home for every version requirement in the workspace. Members inherit with
# `<dep> = { workspace = true }` and add their own `features` / `optional` on top.
#
# This exists mainly so a shared requirement is edited once instead of once per manifest. The
# retroglyph block is the motivating case: those crates are one upstream workspace released
# together, only work as a set, and were previously pinned across ten separate manifests, so a
# partial bump left two incompatible copies of retroglyph-core in the lockfile.
[workspace.dependencies]
# Internal libraries, by path. These are the seven publishable crates; the example games are
# publish = false and stay declared inline at their use sites.
#
# turnbase-cli and turnbase-simulator are hoisted with default-features = false because members
# disagree about wanting the default: 10 of 10 cli dependents and 5 of 8 simulator dependents want
# it off (wasm builds cannot link crossterm). Cargo cannot cleanly turn a workspace dependency's
# default features back off at the member level, so the workspace takes the restrictive setting and
# the members that do want the terminal backend ask for it by name. Both crates' `default` is
# exactly one feature, so `default-features = false, features = ["<that feature>"]` is equivalent
# to the old declaration rather than merely similar.
# The `version` alongside `path` is what makes these publishable: cargo refuses to package a crate
# carrying a bare path dependency, since the registry copy has no path to resolve. Release tooling
# keeps these in step with the crates' own versions as it cascades bumps through the graph.
turnbase = { path = "crates/core", version = "0.1.1" }
turnbase-bots = { path = "crates/bots", version = "0.1.1" }
turnbase-match = { path = "crates/match", version = "0.1.1" }
turnbase-protocol = { path = "crates/protocol", version = "0.1.1" }
turnbase-session = { path = "crates/session", version = "0.1.1" }
turnbase-simulator = { path = "crates/simulator", version = "0.1.1", default-features = false }
turnbase-cli = { path = "crates/cli", version = "0.1.1", default-features = false }

# retroglyph: one upstream workspace, released together. Bump these as a set, never individually --
# retroglyph-crossterm 0.1.3 requires retroglyph-core 0.3, so a patch bump of one drags a breaking
# change of the other. .github/dependabot.yml groups them for the same reason.
retroglyph-core = "0.4"
retroglyph-widgets = "0.4"
retroglyph-crossterm = "0.2"
retroglyph-terminal-wasm = "0.1"

# Third-party.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
web-time = "1"
# Pinned exactly to match retroglyph-terminal-wasm's own wasm-bindgen, so the generated JS glue
# agrees with the runtime shim.
wasm-bindgen = "=0.2.106"
console_error_panic_hook = "0.1"

# Dev-only.
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
