[package]
name = "rock_paper_scissors"
description = "Rock-paper-scissors reference game for the Turnbase engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["cli"]
cli = ["dep:turnbase-cli"]

[dependencies]
turnbase = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
turnbase-cli = { workspace = true, optional = true }

[[bin]]
name = "rock_paper_scissors"
required-features = ["cli"]
