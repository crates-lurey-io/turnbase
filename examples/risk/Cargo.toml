[package]
name = "risk"
description = "Risk-style conquest reference game for the Turnbase engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Tier 1: `cli` gives the headless/text runner; `ui` adds the retroglyph
# dashboard on top. `ui` is on by default so `cargo run -p risk` opens the map.
default = ["ui"]
cli = ["dep:turnbase-cli"]
# The backend-generic PrintableGame dashboard (turnbase-simulator without
# crossterm) plus retroglyph-core. wasm-safe, so the web demos can render it.
printable = ["dep:turnbase-simulator", "dep:retroglyph-core"]
ui = ["cli", "printable", "turnbase-cli/tui"]

[dependencies]
turnbase = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
turnbase-cli = { workspace = true, optional = true }
turnbase-simulator = { workspace = true, optional = true }
retroglyph-core = { workspace = true, optional = true }

[dev-dependencies]
turnbase-bots = { workspace = true }

[[bin]]
name = "risk"
required-features = ["cli"]
