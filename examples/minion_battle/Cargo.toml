[package]
name = "minion_battle"
description = "Minion Battle reference game for the Turnbase engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["cli"]
cli = ["dep:turnbase-cli"]

[dependencies]
turnbase = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
turnbase-cli = { path = "../../crates/cli", default-features = false, optional = true }

[[bin]]
name = "minion_battle"
required-features = ["cli"]
