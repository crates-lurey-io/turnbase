[package]
name = "spire_run"
description = "Slay-the-Spire-shaped run reference game for the Turnbase engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Tier 1: `cli` gives the headless/text runner; `ui` adds the retroglyph
# dashboard on top. `ui` is on by default so `cargo run -p spire_run` opens
# the dashboard.
default = ["ui"]
cli = ["dep:turnbase-cli"]
ui = ["cli", "dep:turnbase-simulator", "dep:retroglyph-core", "turnbase-cli/tui"]

[dependencies]
turnbase = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
turnbase-cli = { workspace = true, optional = true }
turnbase-simulator = { workspace = true, features = ["crossterm"], optional = true }
retroglyph-core = { workspace = true, optional = true }

[dev-dependencies]
turnbase-bots = { workspace = true }

[[bin]]
name = "spire_run"
required-features = ["cli"]
