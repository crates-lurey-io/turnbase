[package]
name = "tic_tac_toe"
description = "Tic-tac-toe reference game for the Turnbase engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# The runnable CLI binary. On by default so `cargo run -p tic_tac_toe` works;
# a rules-only consumer (e.g. a bot's tests) depends with
# `default-features = false` and never pulls the CLI. Tier 0: no terminal UI.
default = ["cli"]
cli = ["dep:turnbase-cli"]

[dependencies]
turnbase = { workspace = true }
serde = { workspace = true, features = ["derive"] }
turnbase-cli = { workspace = true, optional = true }

[[bin]]
name = "tic_tac_toe"
required-features = ["cli"]
