[package]
name = "blackjack"
description = "Blackjack reference game for the Turnbase engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["ui"]
cli = ["dep:turnbase-cli"]
# Unlike the other Tier-1 examples, Blackjack ships its OWN terminal UI
# (`BlackjackTui` in `src/tui.rs`) built directly on retroglyph, rather than
# implementing `PrintableGame` and deferring to the shared `turnbase-simulator`
# dashboard. `app` is the backend-generic App (no terminal backend), so it is
# wasm-safe and the web demo can drive it with a browser backend.
app = ["dep:retroglyph-core", "dep:turnbase-match", "dep:turnbase-bots"]
# The native crossterm `play` entry point on top of the App.
ui = ["cli", "app", "dep:retroglyph-crossterm"]

[dependencies]
turnbase = { path = "../../crates/core", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
turnbase-cli = { path = "../../crates/cli", default-features = false, optional = true }
turnbase-match = { path = "../../crates/match", optional = true }
turnbase-bots = { path = "../../crates/bots", optional = true }
retroglyph-core = { version = "0.2", optional = true }
retroglyph-crossterm = { version = "0.1", optional = true }

[[bin]]
name = "blackjack"
required-features = ["cli"]
