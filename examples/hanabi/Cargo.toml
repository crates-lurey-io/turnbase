[package]
name = "hanabi"
description = "Hanabi reference game for the Turnbase engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Tier 1: `cli` gives the headless/text runner; `ui` adds the retroglyph
# dashboard on top. `ui` is on by default so `cargo run -p hanabi` opens the
# dashboard; `--no-default-features --features cli` gives text-only; a
# rules-only consumer (a bot's tests) uses `default-features = false` and
# links neither the CLI nor the terminal UI.
default = ["ui"]
cli = ["dep:turnbase-cli"]
ui = ["cli", "dep:turnbase-simulator", "dep:retroglyph-core", "turnbase-cli/tui"]

[dependencies]
turnbase = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
turnbase-cli = { workspace = true, optional = true }
turnbase-simulator = { workspace = true, features = ["crossterm"], optional = true }
retroglyph-core = { workspace = true, optional = true }

[dev-dependencies]
turnbase-bots = { workspace = true }

[[bin]]
name = "hanabi"
required-features = ["cli"]
