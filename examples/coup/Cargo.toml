[package]
name = "coup"
description = "Coup reference game for the Turnbase engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Tier 1: `cli` gives the headless/text runner (`run`); `ui` adds the retroglyph
# dashboard on top (`run_tui`). `ui` is on by default so `cargo run -p coup`
# opens the dashboard; `--no-default-features --features cli` gives text-only;
# a rules-only consumer (a bot's tests) uses `default-features = false` and
# links neither the CLI nor the terminal UI.
default = ["ui"]
cli = ["dep:turnbase-cli"]
# The backend-generic PrintableGame dashboard (turnbase-simulator without
# crossterm) plus retroglyph-core. wasm-safe, so the web demos can render it.
printable = ["dep:turnbase-simulator", "dep:retroglyph-core"]
ui = ["cli", "printable", "turnbase-cli/tui"]

[dependencies]
turnbase = { path = "../../crates/core", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
turnbase-cli = { path = "../../crates/cli", default-features = false, optional = true }
turnbase-simulator = { path = "../../crates/simulator", optional = true, default-features = false }
retroglyph-core = { version = "0.3", optional = true }

[dev-dependencies]
turnbase-bots = { path = "../../crates/bots" }

[[bin]]
name = "coup"
required-features = ["cli"]
