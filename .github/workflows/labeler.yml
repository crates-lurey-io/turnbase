name: Labeler

# Three jobs:
#  - path-labels: applies c: labels from .github/labeler.yml based on changed files, keeping them in
#    sync (sync-labels: true) as the PR's diff evolves.
#  - title-labels: derives a c: label from the Conventional Commit PR title that pr-title.yml
#    enforces, e.g. "feat(core): ..." -> c:core. A fallback for what the path config cannot infer,
#    and re-run on every edit so it never goes stale.
#  - triage-labels: marks new issues needs-triage unless a maintainer filed them.
#
# pull_request_target, not pull_request: labeling needs write scope, and a pull_request-triggered
# run gets a read-only token on fork PRs. This workflow never checks out or executes PR code (the
# labeler action reads the file list through the API), so the usual pull_request_target risk does
# not apply here.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  path-labels:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  title-labels:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: 'Derive c: label from PR title'
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            // feat(core): message  ->  scope = core
            const m = title.match(/^\w+(?:\(([\w-]+)\))?!?:\s/);
            if (!m) return;
            const [, scope] = m;
            if (!scope) return;

            // Crate scopes map 1:1 to the c: labels path-labels already applies; this covers what
            // paths cannot infer (a title written before any files are pushed). `deps` has no
            // label of its own.
            const areaScopes = [
              "core", "bots", "match", "simulator", "protocol",
              "session", "cli", "demos", "examples", "workspace",
            ];
            if (!areaScopes.includes(scope)) return;

            const label = `c:${scope}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number,
            });
            if (current.some((l) => l.name === label)) return;

            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });

  triage-labels:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Label new issues needs-triage unless filed by a maintainer
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const username = context.payload.issue.user.login;

            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username,
            });

            if (!["admin", "write", "maintain"].includes(perm.permission)) {
              await github.rest.issues.addLabels({
                owner, repo,
                issue_number: context.payload.issue.number,
                labels: ["needs-triage"],
              });
            }
