name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Least privilege by default. No job here writes to the repo; the jobs that need more (none
# currently) should raise it locally rather than widening this.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: just,taplo-cli
      - run: npm ci --prefix tools
      - run: just rustfmt
      - run: just prettier
      - run: just taplo-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: just,cargo-deny,typos-cli,cargo-machete
      - run: npm ci --prefix tools
      - run: just clippy
      - run: just markdown
      - run: just typos
      - run: just machete
      # Soft-failed on purpose: a newly published RUSTSEC advisory against a transitive
      # dependency would otherwise turn every unrelated PR red overnight, for something no PR
      # author can fix. The finding is still visible in the job log and annotated on the run.
      - run: just deny-advisories
        continue-on-error: true
      # Hard gate: licenses, bans, and sources are fully under this repo's control, and
      # deny.toml's allow-list is deliberately minimal so a new dependency with an unexpected
      # license fails here rather than being absorbed silently.
      - run: just deny-licenses

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: just
      - run: just doc

  # Also builds on the declared MSRV, so workspace.package.rust-version is enforced rather than
  # aspirational. Keep the matrix value and that field in step: raising one without the other
  # either lets the floor rot or fails CI for a floor nothing actually requires.
  compile:
    name: compile ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, '1.88']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: just
      - run: just compile

  # Static analysis of the workflow files themselves: actionlint for syntax, expression types and
  # shellcheck over `run:` blocks, zizmor for supply-chain and permission auditing. Separate from
  # `lint` because it needs neither a Rust toolchain nor the node toolchain, so it finishes in
  # seconds and reports independently.
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: just,zizmor
      # actionlint is not in install-action's catalog (its manifest 404s), and the upstream install
      # script is a `curl | bash`, which would undercut the point of this workflow. Go is
      # preinstalled on the runner, so a version-pinned `go install` gets a reproducible binary
      # without trusting a piped script.
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # `go install` drops the binary in GOPATH/bin, which is not on PATH by default.
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: just actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds each crate with every feature enabled on its own. `--all-features`, which every other
  # job here uses, never builds the combination where a feature is OFF, so it structurally cannot
  # catch a missing #[cfg(feature)] -- and this repo documents three no-default-features
  # configurations as supported.
  hack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: just,cargo-hack
      - run: just hack

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: just,nextest
      - run: just test-ci

      # Codecov Test Analytics: flaky-test detection, failure rate, and run-time trends. Reads the
      # JUnit XML the `ci` nextest profile writes (see .config/nextest.toml). Runs even when the
      # tests failed -- `!cancelled()` rather than `always()`, so a genuinely cancelled run still
      # skips -- because failed runs are exactly the ones Test Analytics most wants to see.
      #
      # Split first, one file per crate flag: Codecov's flag filter is set per upload, not per
      # <testsuite> within an upload, so a single combined upload would attribute every crate's
      # tests to every other crate's flag. See the script's docstring.
      - name: Split JUnit report by crate flag
        if: ${{ !cancelled() }}
        run: python3 tools/split-junit-flags.py target/nextest/ci/junit.xml target/nextest/ci/flags

      # `disable_search: true` is load-bearing, not cosmetic: the Codecov CLI auto-discovers any
      # *junit.xml on disk in addition to `files:`, and the pre-split combined report still sits in
      # the parent directory. Without it every flag would silently re-upload that combined file too,
      # recreating the exact misattribution the split exists to prevent.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: target/nextest/ci/flags/core.xml
          flags: core
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov (bots)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: target/nextest/ci/flags/bots.xml
          flags: bots
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov (match)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: target/nextest/ci/flags/match.xml
          flags: match
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov (simulator)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: target/nextest/ci/flags/simulator.xml
          flags: simulator
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov (protocol)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: target/nextest/ci/flags/protocol.xml
          flags: protocol
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov (session)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: target/nextest/ci/flags/session.xml
          flags: session
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov (cli)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: target/nextest/ci/flags/cli.xml
          flags: cli
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      # The example games and their integration tests, which exercise several crates at once and do
      # not map to a single crate flag. Uploaded with no flag rather than dropped.
      - name: Upload test results to Codecov (unflagged)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: target/nextest/ci/flags/unflagged.xml
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: just,cargo-llvm-cov
      - name: Generate coverage
        run: just coverage-gen
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          # One combined workspace lcov.info, attributed per crate: each flag is scoped by its own
          # `paths:` in codecov.yml, so a single upload still yields per-crate numbers rather than
          # one blended workspace figure.
          flags: core,bots,match,simulator,protocol,session,cli
          # No CODECOV_TOKEN secret configured yet for this repo; don't fail CI on upload
          # errors until one is added (see codecov.yml).
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Single required status check for the branch ruleset, so adding or renaming a job above never
  # requires editing the ruleset. Matches the `required` context the repo's Protect ruleset asks
  # for.
  required:
    runs-on: ubuntu-latest
    needs:
      - format
      - lint
      - actions
      - docs
      - compile
      - hack
      - test
      - coverage
    if: ${{ always() }}
    steps:
      - name: Check required jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS_JSON"
          has_failed="${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}"
          if [ "$has_failed" = "true" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
