name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Least privilege by default. No job here writes to the repo; the jobs that need more (none
# currently) should raise it locally rather than widening this.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: npm ci --prefix tools
      - run: just rustfmt
      - run: just prettier

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - run: npm ci --prefix tools
      - run: just clippy
      - run: just markdown
      # Soft-failed on purpose: a newly published RUSTSEC advisory against a transitive
      # dependency would otherwise turn every unrelated PR red overnight, for something no PR
      # author can fix. The finding is still visible in the job log and annotated on the run.
      - run: just deny-advisories
        continue-on-error: true
      # Hard gate: licenses, bans, and sources are fully under this repo's control, and
      # deny.toml's allow-list is deliberately minimal so a new dependency with an unexpected
      # license fails here rather than being absorbed silently.
      - run: just deny-licenses

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just doc

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just compile

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest
      # The `ci` nextest profile also writes JUnit XML to target/nextest/ci/junit.xml. Nothing
      # consumes it yet; wiring it to Codecov Test Analytics is Phase 6.
      - run: just test-ci

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov
      - name: Generate coverage
        run: just coverage-gen
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          # No CODECOV_TOKEN secret configured yet for this repo; don't fail CI on upload
          # errors until one is added (see codecov.yml).
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Single required status check for the branch ruleset, so adding or renaming a job above never
  # requires editing the ruleset. Matches the `required` context the repo's Protect ruleset asks
  # for.
  required:
    runs-on: ubuntu-latest
    needs:
      - format
      - lint
      - docs
      - compile
      - test
      - coverage
    if: ${{ always() }}
    steps:
      - name: Check required jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS_JSON"
          has_failed="${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}"
          if [ "$has_failed" = "true" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
