name: Docs

on:
  push:
    branches: ['main']

concurrency:
  group: deploy
  cancel-in-progress: false

# Least privilege by default; the deploy job below raises it to the pages/id-token scopes that
# actions/deploy-pages actually needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # wasm-bindgen-cli must match crates/demos/Cargo.toml's wasm-bindgen.
          tool: just,cargo-llvm-cov,wasm-bindgen-cli@0.2.106
      - uses: cargo-bins/cargo-binstall@v1.21.1
      # Generates the per-crate and workspace llms.txt files (see
      # tools/gen-llms-txt.sh); not on taiki-e/install-action, so binstall it.
      - run: cargo binstall cargo-llms-txt --no-confirm -q
      - uses: actions/configure-pages@v6
        id: pages

      # rustdoc API docs + a self-hosted per-line HTML coverage report + the
      # landing page, all under target/doc. See the `docs-site` recipe.
      - run: just docs-site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
