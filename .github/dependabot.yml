version: 2

# Three ecosystems live in this repo: the Cargo workspace, the GitHub Actions used by the workflows,
# and the npm formatter toolchain under tools/.
#
# Everything uses the `deps` Conventional Commit scope, which .github/workflows/pr-title.yml accepts
# and which the changelog config skips, so routine bumps do not appear in release notes.
#
# Updates are grouped rather than one-PR-per-dependency: this is a small workspace and a wall of
# individual bumps is noise that gets rubber-stamped, which is worse than a single reviewable batch.

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Patch and minor bumps together; a major gets its own PR, since that is the one that needs
      # actual review.
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    groups:
      tools:
        patterns:
          - '*'
