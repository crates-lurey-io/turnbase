<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1117" />
    <title>turnbase &mdash; demos</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        line-height: 1.5;
        min-height: 100%;
      }
      body { display: flex; flex-direction: column; align-items: center; padding: 3rem 1.25rem; }
      main { width: 100%; max-width: 46rem; }
      h1 {
        font-size: 2rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      p.tagline { color: #8b949e; margin: 0.5rem 0 2rem; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem; }
      a.card {
        display: block;
        border: 1px solid #30363d;
        border-radius: 10px;
        padding: 1.25rem;
        background: #161b22;
        text-decoration: none;
        color: inherit;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      a.card:hover { border-color: #58a6ff; transform: translateY(-2px); }
      a.card h2 { font-size: 1.15rem; }
      footer { margin-top: 2.5rem; color: #6e7681; font-size: 0.8rem; }
      footer a { color: #58a6ff; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Interactive Demos</h1>
      <p class="tagline">
        Each reference game compiled to WebAssembly and rendered in the browser with xterm.js, the
        same App code the native terminal client runs. Bots play every seat, and each match
        restarts when it ends.
      </p>
      <div class="cards">__CARDS__</div>
      <footer><a href="../">← Back to turnbase</a></footer>
    </main>
  </body>
</html>
